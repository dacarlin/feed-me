name: Update publication feeds

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'pyproject.toml'
      - '.github/workflows/update-feeds.yml'
  workflow_dispatch:
    inputs:
      since:
        description: 'Optional backfill start date (YYYY-MM-DD)'
        required: false
        type: string
  schedule:
    - cron: '17 */3 * * *'

permissions: {}

concurrency:
  group: publication-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      generated: ${{ steps.artifact.outcome == 'success' }}
      source_outcome: ${{ steps.update.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
      - name: Update state and feeds
        id: update
        continue-on-error: true
        env:
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          SINCE: ${{ inputs.since }}
        run: |
          args=()
          if [[ -n "$SINCE" ]]; then
            args+=(--since "$SINCE")
          fi
          python -m pubtracker update "${args[@]}"
      - name: Commit state and generated output
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json site/
          if ! git diff --cached --quiet; then
            git commit -m 'Update publication feeds'
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        with:
          path: site/

  deploy:
    needs: update
    if: ${{ needs.update.outputs.generated == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source failures after deploying successful updates
        if: ${{ needs.update.outputs.source_outcome == 'failure' }}
        run: |
          echo 'One or more sources failed. See the update log; their checkpoints were retained.'
          exit 1
